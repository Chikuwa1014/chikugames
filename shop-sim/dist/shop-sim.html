const r100 = x => Math.max(100, Math.round(x / 100) * 100);

/** 日付から季節番号（0〜3）を求める */
const seaOf = d => Math.floor(Math.floor((Math.max(d, 1) - 1) / MD) / 2) % 4;

/** 季節に応じた天気を抽選 */
function roll(d) {
    const w = WW[seaOf(d)];
    let r = Math.random() * 100;
    for (let i = 0; i < 4; i++) {
        if ((r -= w[i]) < 0)
            return i;
    }
    return 1;
}

/** 0〜100に収める */
const clamp100 = v => Math.max(0, Math.min(100, v));

/** 購買力＝季節×天気（×炎上） */
const pwr = d => SEA[seaOf(d)].p * WE[d === state.day ? state.weather : state.next].p * (state.flame > 0 ? difficulty().fl : 1);

/** 月のテナント料（棚数で指数的に増加） */
const tenantFee = () => r100(4000 * Math.pow(1.6, state.slots - 2) * state.feeMul * difficulty().fee);

/** 現在の売値（原価÷(1-粗利率)） */
const priceOf = p => Math.max(p.c + 1, Math.round(p.c / (1 - state.margin / 100)));

/** 粗利率が高いほど来店数が減る補正 */
const demandFactor = () => Math.min(1.6, Math.max(0.5, 1 - (state.margin - 40) * 0.015));

/** 融資の月々の返済額の合計 */
const loanPay = () => state.loans.reduce((a, l) => a + l.pay, 0);

/** 1日の営業ティック数 */
const dayTicks = () => (state.closeH - state.openH) * 5;

/** 店員の1日あたり給料（基準） */
const wageDay = () => {
    let w = 0;
    for (let h = state.openH; h < state.closeH; h++)
       w += WAGE * (h < 7 || h >= 22 ? 1.25 : 1);
    return w * state.clerk;
};

/** 今月の売上ノルマ（損益分岐点＋前月比） */
function quota() {
    const b = (tenantFee() + loanPay() + state.sal + wageDay() * MD) / Math.max(0.05, state.margin / 100 - 0.0375 * state.pays.length);
    return r100(state.prev == null ? b : Math.max(b, state.prev * difficulty().gr));
}

/** 投資の費用 */
const cost = {
    slot: () => r100(1500 * Math.pow(1.7, state.slots - 2)),
    cap: () => r100(600 * Math.pow(1.6, Math.max(0, CAPS.indexOf(state.cap)))),
    ad: () => r100(800 * Math.pow(1.5, state.ad)),
    clerk: () => r100(4000 * Math.pow(1.5, state.clerk)),
    skill: () => r100(5000 * Math.pow(2.5, state.sk || 0) * Math.max(1, state.clerk)),
    seclv: () => PRL[state.sl || 0] * 3,

};

/** 投資の上限レベル */

    ad: 20,

/** 商品アップグレードの費用 */
const upCost = (id, L) => r100(PRODUCTS[id].b * 15 * Math.pow(1.8, L));

/** 客の性別による商品の買いやすさ */
const gf = (id, g) => (id === 6 || id === 9) ? (g ? 0.5 : 2.5) : (id === 5 || id === 7) ? (g ? 2.5 : 0.5) : 1;

/** アップグレードと原価変動を商品へ反映 */
function applyUp() {
    PRODUCTS.forEach((p, i) => {

function resetInv(n) {

/** 月平均売上 */

/** 長時間営業の幸福度低下に難易度補正をかける */

/** 融資の利子率 */

/** 難易度を時給へ反映 */

const eff = () => Math.max(difficulty().neg ? -10 : 0, (state.sk || 0) - (state.dn || 0));

const clAmt = () => {

<script>
/**
 * actions.js — プレイヤーの操作（補充・投資・融資・預金・開店など）。
 */

/** 空き棚に未陳列の商品を並べる */
function fill() {
    for (let i = 0; i < state.shelf.length; i++) {
        if (state.shelf[i])
            continue;
        const sh = state.shelf.filter(Boolean).map(s => s.id);
        const nx = state.own.find(id => !sh.includes(id));
        if (nx !== undefined)
            state.shelf[i] = { id: nx, st: 0 };
    }
}

/** 1つの棚を補充 */
function restock(i, n) {
    if (state.phase === 'closed' || state.over || ill())
        return;
    const s = state.shelf[i];
    if (!s)
        return;
    const p = PRODUCTS[s.id];
    const q = Math.min(n, state.cap - s.st, Math.floor(state.money / p.c));
    if (q <= 0)
        return;
    s.st += q;
    state.money -= q * p.c;
    render();
    save();
}

/** 投資ボタンの処理 */
function buy(k, id) {
    if (state.phase !== 'closed' || state.over || ill())
        return;
    if (k === 'upg') {
        upgrade(id);
        return;
    }
    if (k === 'new') {
        const p = PRODUCTS[id];
        if (state.money < p.u || state.own.includes(id))
            return;
        state.money -= p.u;
        state.own.push(id);
        fill();
        addLog(p.e + ' ' + p.n + 'を扱い始めました。');
    }
    else {
        const c = cost[k]();
        const cur = {
            slot: state.slots, cap: state.cap, ad: state.ad, clerk: state.clerk, skill: state.sk || 0, seclv: state.sl || 0, secbuy: state.ss || 0
        }[k];
        if (state.money < c || cur >= MAX[k] || (k === 'secbuy' && !(state.sl > 0)))
            return;
        state.money -= c;
        if (k === 'slot') {
            state.slotQ = (state.slotQ || 0) + 1;
            addSlot();
            addLog('棚が' + state.slots + '台に。テナント料は月¥' + fmt(tenantFee()) + 'になります。');
        }
        if (k === 'cap') {
            state.cap = CAPS[CAPS.indexOf(state.cap) + 1] || state.cap;
            addLog('1棚' + state.cap + '個まで置けます。');
        }
        if (k === 'ad') {
            state.ad++;
            addLog('広告を出しました。来店数が増えます。');
        }
        if (k === 'seclv') {
            state.sl = (state.sl || 0) + 1;
            addLog('🛡 ' + SECN[state.sl - 1] + 'を導入できるようになりました。');
        }
        if (k === 'secbuy') {
            if ((state.ss || 0) === 0)
                state.sb = state.day + SECD[state.sl - 1];
            state.ss = (state.ss || 0) + 1;
            addLog('🛡 ' + SECN[state.sl - 1] + 'を購入（ストック' + state.ss + '/5）');
        }
        if (k === 'skill') {
            state.sk = (state.sk || 0) + 1;
            addLog('🧠 店員の能力が上がりました。');
        }
        if (k === 'clerk') {
            state.clerk++;
            addLog('店員を雇いました。営業中に自動補充します。');
        }
    }
    render();
    save();
}

/** 棚を1台増やす（上位商品を解放） */
function addSlot() {
    state.slots++;
    state.shelf.push(null);
    if (state.own.length < state.slots && state.own.length < PRODUCTS.length) {
        state.own.push(state.own.length);
        const q = PRODUCTS[state.own.length - 1];
        addLog(q.e + ' ' + q.n + 'が解放されました。');
    }
    fill();
}

/** 開店前の一括満タン */
function fillAll() {
    if (state.phase !== 'prep' || state.over || ill())
        return;
    state.shelf.map((s, i) => i).filter(i => state.shelf[i]).sort((a, b) => PRODUCTS[state.shelf[a].id].c - PRODUCTS[state.shelf[b].id].c).forEach(i => {
        const s = state.shelf[i], p = PRODUCTS[s.id], q = Math.min(state.cap - s.st, Math.floor(state.money / p.c));
        if (q > 0) {
            s.st += q;
            state.money -= q * p.c;
        }
    });
    addLog('📦 一括補充しました。');
    render();
    save();
}

/** 商品のアップグレード */
function upgrade(id) {
    const L = state.up[id];
    if (L >= 7 || state.sd[id] < TH[L])
        return;
    const c = upCost(id, L);
    if (state.money < c)
        return;
    state.money -= c;
    state.up[id]++;
    applyUp();
    addLog('⬆ ' + PRODUCTS[id].e + ' ' + PRODUCTS[id].n + 'にアップグレード！');
    render();
    save();
}

/** 難易度を選んで新規開始 */
function newGame(v) {
    const d = DF[v];
    if (!d)
        return;
    state = fresh();
    state.diff = v;
    state.money = d.money;
    state.margin = d.mg;
    state.sal = 0;
    applyDiff();
    applyUp();
    state.next = roll(1);
    state.weather = state.next;
    render();
    save();
}

/** 預金の預け入れ・引き出し */
function svMove(dir) {
    if (state.phase !== 'closed' || state.over)
        return;
    const a = dir > 0 ? Math.min(state.svs || 0, Math.floor(Math.max(0, state.money) / 1000) * 1000) : Math.min(state.svs || 0, state.sv || 0);
    if (a <= 0)
        return;
    if (dir > 0) {
        state.money -= a;
        state.sv = (state.sv || 0) + a;
    }
    else {
        state.money += a;
        state.sv -= a;
    }
    addLog('🏦 預金' + (dir > 0 ? 'に¥' + fmt(a) + 'を預けました' : 'から¥' + fmt(a) + 'を引き出しました'));
    render();
    save();
}

/** 融資を借りる */
function takeLoan() {
    if (state.phase !== 'closed' || state.over || state.loans.length >= 3)
        return;
    const a = state.ln.a, m = state.ln.m;
    if (a >= 1500000 && a > loanCap())
        return;
    if (m > 12 && a < 1500000)
        return;
    const p = Math.round(a * (1 + intr(m)) / m);
    state.money += a;
    state.loans.push({ left: m, pay: p });

        }

}

<script>
/**
 * share.js — 倒産時のSNS共有（リザルト画像・Xへの投稿・文面のコピー）。
 */

/** 共有する文面とハッシュタグ */
const SHARE_MSG = 'ちいさなお店を開いたけど倒産しちゃった！残念😢';
const SHARE_TAG = 'ちくわげーむず';

/** ゲームのURL（今開いているページ。#以降は除く） */
const shareUrl = () => location.href.split('#')[0];

/** コピー用・共有メニュー用の文面（URL込み） */
const shareText = () => SHARE_MSG + '\n#' + SHARE_TAG + '\n' + shareUrl();

/** 作成済みのリザルト画像（ゲームが変わったら作り直す） */
let shareFile = null, shareFor = null;

/** 画像用：幅に収まるように折り返す（最大 max 行） */
function wrapText(g, t, w, max) {
    const L = [];
    let s = '';
    for (const ch of t) {
        if (g.measureText(s + ch).width > w) {
            L.push(s);
            s = ch;
        }
        else
            s += ch;
    }
    if (s)
        L.push(s);
    if (L.length > max) {
        L.length = max;
        L[max - 1] = L[max - 1].slice(0, -1) + '…';
    }
    return L;
}

/** リザルト画像（1200×630）を作る */
function resultImage() {
    const W = 1200, H = 630, c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d'), F = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';
    // 背景と屋根
    g.fillStyle = '#0e1c19';
    g.fillRect(0, 0, W, H);
    for (let x = 0; x < W; x += 44) {
        g.fillStyle = '#e63946';
        g.fillRect(x, 0, 22, 32);
        g.fillStyle = '#ffffff';
        g.fillRect(x + 22, 0, 22, 32);
    }
    // タイトル
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#8fb0a5';
    g.font = '700 34px ' + F;
    g.fillText('🏪 ちいさなお店', 48, 92);
    g.fillStyle = '#ff6b76';
    g.font = '900 60px ' + F;
    g.fillText('倒産しました…', 48, 164);
    // ドット絵（192×92 を3倍、ドットのまま拡大）
    g.fillStyle = '#27473e';
    g.fillRect(42, 194, 588, 288);
    g.imageSmoothingEnabled = false;
    g.drawImage(byId('px'), 48, 200, 576, 276);
    // 成績
    const d = Math.max(state.day, 1), m = Math.floor((d - 1) / MD) + 1;
    const yen = v => (v < 0 ? '-' : '') + '¥' + fmt(Math.abs(Math.round(v)));
    const rows = [
        ['難易度', difficulty().n],
        ['営業日数', m + 'ヶ月目・通算' + state.day + '日'],
        ['累計売上', yen(state.tot || 0)],
        ['最終所持金', yen(state.money)],
        ['預金', yen(state.sv || 0)],
        ['棚の数', state.slots + '台']
    ];
    rows.forEach(([k, v], i) => {
        const y = 230 + i * 46;
        g.fillStyle = '#8fb0a5';
        g.font = '700 24px ' + F;
        g.textAlign = 'left';
        g.fillText(k, 668, y);
        g.fillStyle = k === '最終所持金' && state.money < 0 ? '#ff6b76' : '#e4f3ec';
        g.font = '800 30px ' + F;
        g.textAlign = 'right';
        g.fillText(v, 1152, y);
        g.fillStyle = '#27473e';
        g.fillRect(668, y + 14, 484, 2);
    });
    // 倒産理由
    g.textAlign = 'left';
    g.fillStyle = '#e4f3ec';
    g.font = '700 26px ' + F;
    wrapText(g, state.overMsg || '資金が倒産ラインを下回り、倒産しました。', W - 96, 2).forEach((t, i) => g.fillText(t, 48, 530 + i * 36));
    // ハッシュタグ
    g.fillStyle = '#ffd23f';
    g.font = '800 24px ' + F;
    g.textAlign = 'right';
    g.fillText('#' + SHARE_TAG, W - 48, 606);
    return c;
}

/** 倒産時にリザルト画像を先に作っておく（共有ボタンを押した瞬間に渡せるように） */
function prepShare() {
    if (!state.over || shareFor === state)
        return;
    shareFor = state;
    shareFile = null;
    setTimeout(() => {
        const s = state;
        resultImage().toBlob(b => {
            if (b && s === state)
                shareFile = new File([b], 'chiisana-omise.png', { type: 'image/png' });
        }, 'image/png');
    }, 0);
}

/** 倒産カードの下に出す共有欄 */
function shareBox() {
    prepShare();
    const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    return '<div class="card share"><b>📣 結果をシェア</b>' +
        '<div class="row"><button data-a="share">📤 結果をシェア</button><button class="alt" data-a="shimg">🖼 画像を保存</button></div>' +
        '<div class="meta">スマホでは画像付きで共有できます。共有メニューが出ないときはXの投稿画面が開くので、保存した画像を添付してください。</div>' +
        '<textarea id="shtx" readonly rows="4">' + esc(shareText()) + '</textarea>' +
        '<button class="alt" data-a="shcopy" style="width:100%">📋 文面をコピー</button></div>';
}

/** Xの投稿画面を開く（画像は添付できない） */
function openX() {
    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(SHARE_MSG) + '&url=' + encodeURIComponent(shareUrl()) + '&hashtags=' + encodeURIComponent(SHARE_TAG), '_blank', 'noopener');
}

/** 共有：使えれば端末の共有メニュー（画像付き）、だめならXの投稿画面 */
function shareResult() {
    const data = shareFile ? { text: shareText(), files: [shareFile] } : null;
    if (data && navigator.canShare && navigator.canShare(data)) {
        navigator.share(data).catch(e => {
            if (e && e.name !== 'AbortError')
                openX();
        });
        return;
    }
    openX();
}

/** リザルト画像を保存（ダウンロード） */
function saveResultImage() {
    resultImage().toBlob(b => {
        if (!b)
            return;
        const u = URL.createObjectURL(b), a = document.createElement('a');
        a.href = u;
        a.download = 'chiisana-omise.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 10000);
    }, 'image/png');
}

/** 文面をコピー */
function copyShareText(b) {
    const done = () => {
        b.textContent = '✅ コピーしました';
        setTimeout(() => b.textContent = '📋 文面をコピー', 2000);
    };
    const old = () => {
        const t = byId('shtx');
        t.select();
        try {
            document.execCommand('copy');
            done();
        }
        catch (e) { }
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(shareText()).then(done, old);
    else
        old();
}

    }
    byId('pn').innerHTML = pn;
    byId('sd').innerHTML = '<button class="' + (state.paused ? '' : 'alt') + '" data-a="pause"' + (state.phase === 'open' ? '' : ' disabled') + '>' + (state.paused ? '▶' : '⏸') + '</button>' + [1, 2, 4, 8].map(v => '<button class="' + ((state.spd || 1) === v ? '' : 'alt') + '" data-a="spd" data-v="' + v + '">×' + v + '</button>').join('');
    if (!dragMg)
        byId('mnyA').innerHTML = '';
    if (!dragMg)
        byId('mg').innerHTML = (state.phase === 'closed' && !state.over) ? '<div class="card"><div class="row"><b>粗利率の設定</b><span id="mgv"></span></div><input type="range" min="10" max="70" step="1" value="' + state.margin + '" data-a="mg" style="width:100%"><div class="meta">高くすると1個あたりの利益は増えますが、来店数が減ります。</div></div>' + '<div class="card"><div class="row"><b>自分の月収</b><span id="slv"></span></div><input type="range" min="0" max="600000" step="10000" value="' + state.sal + '" data-a="sal" style="width:100%"><div class="meta">月末に引かれます。年収中央値（約400万円＝月約33万円）が目安。多いと幸福度が上がり、少ないと下がります。</div></div><div class="card"><b>営業時間</b><div class="row" style="margin-top:6px"><select data-a="oh">' + hrs(5, 22, state.openH) + '</select><select data-a="ch">' + hrs(6, 23, state.closeH) + '</select></div><div class="meta">長時間営業は幸福度を下げます。</div></div>' + '<div class="card"><div class="row"><b>🏦 預金</b><span>残高 ¥' + fmt(state.sv || 0) + '</span></div><input type="range" min="0" max="' + Math.max(Math.floor(Math.max(0, state.money) / 1000) * 1000, state.sv || 0) + '" step="1000" value="' + (state.svs || 0) + '" data-a="svx" style="width:100%"><div class="row"><span id="svv"></span></div><div class="btns"><button data-a="svin">預ける</button><button class="alt" data-a="svout">引き出す</button></div><div class="meta">月末に所持金がマイナスになると、自動で預金から引き出されます。</div></div>' : '';
    const mv = byId('mgv');
    if (mv)
        mv.textContent = state.margin + '%（来店数 ×' + Math.round(demandFactor() * 100) / 100 + '）';
    const sv = byId('slv');
    if (sv)
        sv.textContent = '¥' + fmt(state.sal) + (state.sal >= 330000 ? '（中央値以上）' : '（中央値未満）');
    {
        const dd = difficulty();
        [['[data-a="mg"]', dd.full], ['[data-a="sal"]', dd.sal], ['[data-a="la"]', dd.full]].forEach(([q, v]) => {
            const e = document.querySelector(q);
            if (e && !v)
                e.closest('.card').style.display = 'none';
        });
        byId('dt').textContent = dd.n + ' / ' + byId('dt').textContent;
        byId('dfc').style.display = state.diff ? 'none' : 'block';
    }
    {
        const sw = byId('svv');
        if (sw)
            sw.textContent = '金額 ¥' + fmt(state.svs || 0);
        const A = byId('mnyA'), B = byId('mnyB');
        B.innerHTML = '';
        const lc = document.querySelector('[data-a="la"]');
        if (lc)
            B.appendChild(lc.closest('.card'));
        if (!dragMg) {
            A.innerHTML = '';
            ['mg', 'sal', 'svx'].forEach(k => {
                const e = document.querySelector('[data-a="' + k + '"]');
                if (e)
                    A.appendChild(e.closest('.card'));
            });
        }
        byId('mny').style.display = (A.children.length + B.children.length) ? '' : 'none';
        byId('ph').textContent = PHN[state.phase] || '';
        byId('tabs').innerHTML = ['🏪 営業', '🛒 投資', '💰 お金', '⚙ 設定'].map((t, i) => '<button class="' + ((state.tab || 0) === i ? '' : 'alt') + '" data-a="tab" data-v="' + i + '">' + t + '</button>').join('');
        [0, 1, 2, 3].forEach(i => {
            const e = byId('p' + i);
            if (e)
                e.style.display = (state.tab || 0) === i ? '' : 'none';
        });
    }
    const can = state.phase !== 'closed' && !state.over && !ill();
    byId('sh').innerHTML = state.shelf.map((s, i) => {
        if (!s)
            return '<div class="shelf empty">空き棚<br>新商品を扱うと並びます</div>';
        const p = PRODUCTS[s.id], dis = (!can || state.money < p.c || s.st >= state.cap) ? ' disabled' : '';
        return '<div class="shelf"><div class="top"><span class="emo">' + p.e + '</span><div><div class="nm">' + p.n + (state.up[s.id] ? ' <small>Lv' + state.up[s.id] + '</small>' : '') + '</div><span class="price">¥' + fmt(priceOf(p)) + '</span></div></div>' +
            '<div class="bar' + (s.st <= Math.ceil(state.cap * .2) ? ' low' : '') + '"><i style="width:' + (s.st / state.cap * 100) + '%"></i></div>' +
            '<div class="cnt"><span>' + s.st + ' / ' + state.cap + '個</span><span>原価 ¥' + fmt(p.c) + '</span></div>' +
            '<div class="btns"><button class="alt" data-a="r" data-i="' + i + '" data-n="5"' + dis + '>+5</button><button data-a="r" data-i="' + i + '" data-n="999"' + dis + '>満タン</button></div></div>';
    }).join('');
    const ok = state.phase === 'closed' && !state.over && !ill();
    const row = (k, id, t, dsc, price, done) => '<div class="card up"><div class="tx"><div class="nm">' + t + '</div><div class="d">' + dsc + '</div></div><button data-a="b" data-k="' + k + '" data-id="' + id + '"' + (done || !ok || state.money < price ? ' disabled' : '') + '>' + (done === 1 ? '未解放' : done ? '最大' : '¥' + fmt(price)) + '</button></div>';
    const R = [];
    R.push(row('slot', '', '🪜 棚を増やす（' + state.slots + '/' + MAX.slot + '）', '次の解放: ' + (state.own.length < PRODUCTS.length ? PRODUCTS[state.own.length].e + ' ' + PRODUCTS[state.own.length].n : 'なし') + '。テナント料は約1.6倍に', cost.slot(), state.slots >= MAX.slot));
    R.push(row('cap', '', '📦 棚の容量アップ（' + state.cap + '個）', '次の容量: ' + (CAPS[CAPS.indexOf(state.cap) + 1] || '最大') + '個', cost.cap(), state.cap >= MAX.cap));
    R.push(row('ad', '', '📣 広告（Lv.' + state.ad + '）', '来店数とまとめ買いが増える', cost.ad(), state.ad >= MAX.ad));
    R.push(row('clerk', '', '🧑‍🍳 店員（' + state.clerk + '人）', '営業中、毎秒ランダムな棚へ自動補充（補充量は能力で上がる）。時給¥' + fmt(WAGE) + '（〜7時・22時〜は125%）・給料は月末払い', cost.clerk(), state.clerk >= MAX.clerk));
    PRODUCTS.forEach((p, id) => {
        if (false)
            R.push(row('new', id, p.e + ' ' + p.n + 'を扱う', '原価¥' + fmt(p.c) + ' → 売値¥' + fmt(priceOf(p)) + '（利益¥' + fmt(priceOf(p) - p.c) + '）', p.u, false));
    });
    const SECR = [];
    SECR.push(row('seclv', '', '🛡 セキュリティ Lv.' + (state.sl || 0) + '/10' + (state.sl ? ' ' + SECN[state.sl - 1] : ''), (state.sl >= 10 ? '最大レベル' : '次: ' + SECN[state.sl || 0] + '（' + SECX[state.sl || 0] + '）'), cost.seclv(), (state.sl || 0) >= 10));
    SECR.push(row('secbuy', '', '🛡 ストックを買う（' + (state.ss || 0) + '/5）', (state.sl > 0 ? SECN[state.sl - 1] + '：' + SECX[state.sl - 1] + '。破損まで' + ((state.ss || 0) > 0 ? Math.max(0, (state.sb || 0) - state.day) + '日' : (SECD[state.sl - 1] / 7) + 'ヶ月') + '（盗難1回ごとに1つ消費）' : 'まずレベルを上げてください'), cost.secbuy(), !(state.sl > 0) ? 1 : (state.ss || 0) >= 5));
    R.push(row('skill', '', '🧠 店員の能力（Lv.' + eff() + '/10）', '1回の補充量: ' + (eff() >= 10 ? '満タン' : eff() < 0 ? '0（盗難中）' : 5 * Math.pow(2, eff()) + '個') + '。投資ごとに2倍、Lv10で満タン', cost.skill(), (state.sk || 0) >= 10));
    R.push(...SECR);
    PRODUCTS.forEach((p, i) => {
        if (!state.own.includes(i))
            return;
        const L = state.up[i];
        let d, pc = 0, dn = false;
        if (L >= 7) {
            d = '最大レベル';
            dn = true;
        }
        else if (state.sd[i] < TH[L]) {
            d = '解放まであと' + (TH[L] - state.sd[i]) + '個販売 → ' + NM[i][L];
            dn = 1;
        }
        else {
            pc = upCost(i, L);
            d = '→ ' + NM[i][L] + '（原価・売価アップ）';
        }
        R.push(row('upg', i, '⬆ ' + p.e + ' ' + p.n + ' Lv.' + L + '/7', d, pc, dn));
    });
    byId('up').innerHTML = R.join('');
}

document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled)
        return;
    const a = b.dataset.a;
    if (a === 'r')
        restock(+b.dataset.i, +b.dataset.n);
    if (a === 'b')
        buy(b.dataset.k, b.dataset.id === '' ? null : +b.dataset.id);
    if (a === 'diff')
        newGame(b.dataset.v);
    if (a === 'tab') {
        state.tab = +b.dataset.v;
        render();
        save();
        byId('scr').scrollTop = 0;
    }
    if (a === 'svin')
        svMove(1);
    if (a === 'svout')
        svMove(-1);
    if (a === 'pause') {
        state.paused = !state.paused;
        render();
    }
    if (a === 'fillall')
        fillAll();
    if (a === 'share')
        shareResult();
    if (a === 'shimg')
        saveResultImage();
    if (a === 'shcopy')
        copyShareText(b);
    if (a === 'spd') {
        state.spd = +b.dataset.v;
        render();
        save();
    }
    if (a === 'loan')
        takeLoan();
    if (a === 'open')
        openShop();
    if (a === 'next')
        nextDay();
    if (a === 'hol') {
        state.hol = !state.hol;
        render();
        save();
    }
    if (a === 'reset') {
        if (!window.rs) {
            window.rs = 1;
            b.textContent = 'もう一度押すとリセットします';
            setTimeout(() => {
                window.rs = 0;
                b.textContent = '最初からやり直す';
            }, 4000);
        }
        else {
            window.rs = 0;
            b.textContent = '最初からやり直す';
            state = fresh();
            applyUp();
            state.next = roll(1);
            state.weather = state.next;
            dragMg = false;
            render();
            save();
        }
    }
});

document.addEventListener('input', e => {
    const a = e.target.dataset.a;
    if (a === 'mg') {
        dragMg = true;
        state.margin = +e.target.value;
        render();
    }
    if (a === 'sal') {
        dragMg = true;
        state.sal = +e.target.value;
        render();
    }
    if (a === 'svx') {
        dragMg = true;
        state.svs = +e.target.value;
        render();
    }
});

document.addEventListener('change', e => {
    const t = e.target, a = t.dataset.a;
    if (a === 'mg') {
        dragMg = false;
        state.margin = +t.value;
        render();
        save();
    }
    if (a === 'sal') {
        dragMg = false;
        state.sal = +t.value;
        render();
        save();
    }
    if (a === 'svx') {
        dragMg = false;
        state.svs = +t.value;
        render();
        save();
    }
    if (a === 'oh') {
        state.openH = +t.value;
        if (state.closeH <= state.openH)
            state.closeH = state.openH + 1;
        render();
        save();
    }
    if (a === 'ch') {
        state.closeH = +t.value;
        if (state.closeH <= state.openH)
            state.openH = state.closeH - 1;
        render();
        save();
    }
    if (a === 'la') {
        state.ln.a = +t.value;
        if (state.ln.a < 1500000 && state.ln.m > 12)
            state.ln.m = 12;
        render();
    }
    if (a === 'lm') {
        state.ln.m = +t.value;
        render();
    }
});

/** 画面の組み替え（固定の上部・タブ・スクロール領域）。起動時に1回だけ呼ぶ */
function initLayout() {
    const tp = document.createElement('div');
    tp.id = 'top';
    document.querySelector('.awning').after(tp);
    const hr = document.createElement('div');
    hr.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:8px';
    byId('dt').style.cssText = 'font-size:12px;text-align:right';
    hr.append(byId('m'), byId('dt'));
    tp.append(hr);
    const dd = byId('px').closest('details');
    dd.style.margin = '4px 0';
    tp.append(dd, byId('sd'));
    const tb = document.createElement('div');
    tb.id = 'tabs';
    tb.className = 'sd';
    tp.append(tb);
    const mk = i => {
        const d = document.createElement('div');
        d.id = 'p' + i;
        return d;
    }, P0 = mk(0), P1 = mk(1), P2 = mk(2), P3 = mk(3);
    [byId('gl').closest('.card'), byId('act'), byId('lg'), byId('pn'), byId('sh').previousElementSibling, byId('sh')].forEach(e => P0.append(e));
    P1.append(byId('up').previousElementSibling, byId('up'));
    const my = byId('mny');
    my.open = true;
    P2.append(my);
    P3.append(byId('mg'), document.querySelector('.foot'));
    const sc = document.createElement('div');
    sc.id = 'scr';
    sc.append(P0, P1, P2, P3);
    tp.after(sc);
}
</script>
<script>
/**
 * main.js — 起動処理（読み込みの最後に実行）。
 */

PRODUCTS.forEach(p => {
    p.b = p.c;
    p.n0 = p.n;
});
applyUp();
if (!LA.includes(state.ln.a))
    state.ln.a = LA[0];
applyDiff();
initLayout();
setInterval(() => {
    fr++;
    drawPx();
}, 180);
drawPx();
fill();
render();
(function loop() {
    tick();
    setTimeout(loop, 1000 / (state.spd || 1));
})();
</script>
</body>
</html>
